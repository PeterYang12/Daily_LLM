   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="395.28" y="16.318125" transform="rotate(-0 395.28 16.318125)">SDK measurement C=N=64 after two preparation procedures</text>
  </g>
  <g id="text_23">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(7.2 339.75215)">Left: median throughput and run min–max. Right: per-run rates (dots) and pooled first-call counts (horizontal lines).</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(7.2 348.7104)">Every slot running once at C8 does not prove that all connections needed at C64 are pre-established. The conditions were not randomized.</text>
